<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="启航 · 全部网站，按用途分类列出收录的所有官方站点，支持实时筛选。" />
<title>其他网页 · 启航</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css?v=20261015m" />
<link rel="stylesheet" href="css/sites.css?v=20261015m" />
</head>
<body>

<header class="topbar"></header>

<main class="wrap">

  <!-- 页头：只有标题，「返回主页」挂在右侧。
       标题下面那句（「这里把能找到的官网都收进来…共 100 个…」）先撤了，
       等文案定了再补。原来那两条大提示块更早之前就删掉了。 -->
  <section class="as-head">
    <div class="page-head">
      <div class="page-head-text">
        <h1>其他网页</h1>
      </div>

      <a class="back-home" href="index.html">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg>
        <span>返回主页</span>
      </a>
    </div>
  </section>

  <div class="as-bar">
    <div class="as-search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="11" cy="11" r="6.4"/><path d="M16 16l4.2 4.2"/>
      </svg>
      <input id="asFilter" type="text" autocomplete="off" enterkeyhint="search" placeholder="输入名字筛选本站站点；按回车则把输入内容交给搜索引擎" aria-label="筛选本站站点，或按回车用搜索引擎搜索" />
      <button class="as-clear" id="asClear" type="button" hidden aria-label="清空">×</button>
    </div>
  </div>

  <div class="as-layout">
    <aside class="as-side" id="asSide"></aside>

    <div class="as-main">
      <div id="asGroups"></div>
      <p class="as-empty" id="asEmpty" hidden>没有找到匹配的网站，换个词试试</p>
    </div>
  </div>

</main>

<!-- 介绍弹窗 + 灯箱：和 index.html 里那份完全一样。
     「介绍」按钮由 js/app.js 的 openIntro() 打开，所以这里也要有这套 DOM。 -->
<div class="modal-mask" id="introModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>

    <div class="modal-shot" id="modalShot">
      <button class="shot-main" id="shotMain" type="button" title="点击全屏查看原图">
        <img id="modalImg" alt="" />
        <span class="shot-zoom">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/>
          </svg>
          全屏查看
        </span>
      </button>

      <span class="shot-meta" id="shotMeta"></span>
      <span class="shot-count" id="shotCount"></span>

      <button class="shot-nav shot-prev" id="shotPrev" type="button" aria-label="上一张">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 6 8.5 12l6 6"/>
        </svg>
      </button>
      <button class="shot-nav shot-next" id="shotNext" type="button" aria-label="下一张">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 6l6 6-6 6"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="modal-head">
        <span class="site-ico" id="modalIcon"></span>
        <div class="modal-title">
          <h3 id="modalTitle">—</h3>
          <p id="modalTagline"></p>
        </div>
        <a class="modal-mini-go" id="modalTopGo" href="#" target="_blank" rel="noopener noreferrer">直达官网</a>
      </div>

      <div class="modal-cols">
        <section class="mcol pros">
          <h4><span class="mcol-mark">优点</span></h4>
          <ul id="modalPros"></ul>
        </section>
        <section class="mcol cons">
          <h4><span class="mcol-mark">缺点</span></h4>
          <ul id="modalCons"></ul>
        </section>
      </div>

      <p class="modal-best" id="modalBest"></p>
      <p class="modal-tips" id="modalTips"></p>

      <div class="modal-foot">
        <a class="go-btn" id="modalGo" href="#" target="_blank" rel="noopener noreferrer">
          访问官网
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h13M12.5 5.5 19 12l-6.5 6.5"/>
          </svg>
        </a>
        <span class="modal-host" id="modalHost"></span>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" type="button" aria-label="关闭全屏">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </button>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="上一张">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 6 8.5 12l6 6"/>
    </svg>
  </button>
  <img class="lb-img" id="lbImg" alt="" />
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="下一张">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 6l6 6-6 6"/>
    </svg>
  </button>
  <div class="lb-bar">
    <span id="lbCaption"></span>
    <em id="lbCount"></em>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/data.js?v=20261015m"></script>
<script src="js/seek.js?v=20261015m"></script>
<script src="js/app.js?v=20261015m"></script>
<script src="js/sites.js?v=20261015m"></script>
<script src="js/topbar.js?v=20261015m"></script>
</body>
</html>
